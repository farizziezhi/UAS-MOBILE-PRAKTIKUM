name: pokedex_gacha
description: "Pokedex Gacha - Flutter app with PokeAPI, Supabase, and Weighted RNG Gacha system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── Backend-as-a-Service (Auth + DB) ──
  supabase_flutter: ^2.9.0

  # ── HTTP Client (PokeAPI via Dio) ──
  dio: ^5.8.0+1

  # ── JSON Serialization (Model layer) ──
  json_annotation: ^4.9.0

  # ── Typography ──
  google_fonts: ^6.2.1

  # ── Image Caching (Pokemon sprites) ──
  cached_network_image: ^3.4.1

  # ── Icons ──
  cupertino_icons: ^1.0.8

  # Env
  flutter_dotenv: ^6.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ── Code Generation (json_serializable) ──
  build_runner: ^2.4.15
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
